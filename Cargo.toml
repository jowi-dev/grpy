[package]
name = "grpy"
version = "0.1.0"
edition = "2024"
description = "Discover local concerts from a TUI and add them to Google Calendar"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"
