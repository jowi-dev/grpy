[package]
name = "grpy"
version = "0.1.0"
edition = "2024"
description = "Discover local concerts from a TUI and add them to Google Calendar"
license = "MIT"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
keyring = "4.2.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
